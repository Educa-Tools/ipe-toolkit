<svg xmlns="http://www.w3.org/2000/svg" class="iso" viewBox="86 -15 408 400" width="408" height="400">
<!-- Esplora · rincón de aula en isométrico (portada, sección «Un aula que se construye curso a curso").
     Colores: solo los de marca/kit/COLORES.txt. Movimiento lento; quieto con «reducir movimiento». -->
<style>
.iso{stroke:#1E1C1A;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.iso *{vector-effect:non-scaling-stroke}
.sin{stroke:none}
.tiza{fill:none;stroke:#E8EDC4}
/* Tiza de la pizarra: se dibuja paso a paso y se borra */
.iso .traza{vector-effect:none;stroke-width:.09;stroke-dasharray:1;animation:traza 8s cubic-bezier(.77,0,.175,1) infinite both}
.t2{animation-delay:.6s!important}.t3{animation-delay:1.2s!important}.t4{animation-delay:1.8s!important}.t5{animation-delay:2.4s!important}
@keyframes traza{0%{stroke-dashoffset:1}30%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
/* Reloj de la sesión de 50 minutos */
.aguja{animation:gira 6s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* Barra de progreso en las pantallas */
.barra{transform-box:fill-box;transform-origin:left;animation:llena 3.5s cubic-bezier(.23,1,.32,1) infinite alternate}
.barra.d1{animation-delay:-1.6s}
@keyframes llena{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
/* Visto bueno que sale de cada portátil y sube */
.idea{transform-box:fill-box;transform-origin:center;animation:idea 6s cubic-bezier(.23,1,.32,1) infinite both}
.idea.d1{animation-delay:3s}
@keyframes idea{0%{opacity:0;transform:translateY(10px) scale(.5)}12%{opacity:1;transform:translateY(0) scale(1)}55%{opacity:1;transform:translateY(-12px) scale(1)}70%,100%{opacity:0;transform:translateY(-18px) scale(1)}}
/* Una herramienta nueva entra en la estantería */
.libro{transform-box:fill-box;transform-origin:bottom;animation:libro 7s cubic-bezier(.23,1,.32,1) infinite both}
@keyframes libro{0%,20%{opacity:0;transform:scaleY(0)}35%,88%{opacity:1;transform:scaleY(1)}100%{opacity:0;transform:scaleY(1)}}
/* Nubes por la ventana y planta que se mece */
.nube{animation:nube 18s linear infinite}
.nube.d1{animation-delay:-9s}
@keyframes nube{from{transform:translateX(-1.4px)}to{transform:translateX(3.8px)}}
.planta{transform-origin:324px 318px;animation:mece 3.5s ease-in-out infinite alternate}
@keyframes mece{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.iso *{animation:none!important}}
</style>
